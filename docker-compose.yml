services:
  mongodb:
    image: mongo:7.0
    container_name: smart-parcel-box-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: smart_parcel_box
    volumes:
      - mongo-data:/data/db
    networks:
      - parcelbox-network

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: smart-parcel-box-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infrastructure/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - parcelbox-network

networks:
  parcelbox-network:
    driver: bridge

volumes:
  mongo-data:
  mosquitto-data:
  mosquitto-log:

