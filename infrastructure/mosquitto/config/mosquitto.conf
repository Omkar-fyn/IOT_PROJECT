# Mosquitto MQTT Broker Configuration for Smart Parcel Box
listener 1883 0.0.0.0
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Connection limits
max_connections -1
max_queued_messages 1000

